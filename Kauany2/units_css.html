<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        /*CSS interno*/
        
        #main{
            font-size: 50px;
        }
        div{
            background-color: blueviolet;
            margin-bottom: 10px;
        }
        #px2{
            width: 100px;

        }
        #porcentagem2{
            width: 50%;

        }
        #em2{
            width: 1em;

        }
        #rem2{
            width: 1rem;

        }
        #vw2{
            width: 50vw;

        }
        #vh2{
            width: 50vh;

        }
        h1{
            background-color: lightcoral;
        }

        #px{
            font-size: 50px;
            /*Medida fixa*/
        }
        #porcentagem{
            font-size: 50%;
            /*Medida flexível que se baseia no elemento pai*/
        }
        #em{
            font-size: 1em;
            /*Medida flexível que se baseia no elemento pai*/
        }
        #rem{
            font-size: 1rem;
            /*Medida flexível que se baseia no elemento raíz(html) 1 rem = 16px*/
        }
        #vw{
            font-size: 10vw;
            /*/*Medida flexível que se baseia na largura da tela*/
        }
        #vh{
            font-size: 10vh;
            /*Medida flexível que se baseia na altura da tela*/
        }
    </style>

    <title>Unidades</title>
</head>
<body>

    <main id="main">
        <h1 id="px">Medida por px</h1>
        <h1 id="porcentagem">Medida por porcentegem</h1>
        <h1 id="em">Medida por em</h1>
        <h1 id="rem">Medida por rem</h1>
        <h1 id="vw">Medida por vw</h1>
        <h1 id="vh">Medida por vh</h1>

        <hr>

        <div id="px2">Px</div>
        <div id="porcentagem2">Porcentegem</div>
        <div id="em2">Em</div>
        <div id="rem2">Rem</div>
        <div id="vw2">Vw</div>
        <div id="vh2">Vh</div>
    </main>
    
</body>
</html>
