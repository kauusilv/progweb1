<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /*CSS interno*/
        main{
            border: solid blue;
        }
        
        div{
            background-color: yellowgreen;
            height: 200px;
            width: 200px;
            padding: 10px;
            margin: 20px;
            border: solid black;
        }
        #div1{
            margin-bottom: 0; /*Margem de baixo*/
        }
        #div2{
            margin-top: 0; /*Margem de cima*/
        }

    </style>
    
    <title>Box model</title>

</head>
<body>
    <main>
        <div id="div1">
            Box Model 1
        </div>
        <div id="div2">
            Box Model 2
        </div>
        
        
    </main>
    
</body>
</html>
