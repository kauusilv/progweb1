<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <style>
        /*CSS interno*/
        main{
            display:flex;
            flex-direction: row;
            border: solid black;
            align-items: flex-start; /*Move os itens na vertical*/
            justify-content: center; /*Move os itens na horizontal*/
            min-height: 300px;
        }
        div{
            background-color: lightcoral;
            height: 10rem;
            width: 10rem;
            margin: 1px;
            display: inline-block;
        }
        
    </style>

    <title>Display</title>
</head>
<body>
    <main>
        <div>1</div>
        <div>2</div>
        <div>3</div>
        <div>4</div>
        <div>5</div>
    </main>
    
</body>
</html>
